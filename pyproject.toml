[project]
name = "study-copilot"
version = "0.1.0"
description = "Graph-grounded study agent powered by FalkorDB"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "falkordb>=1.1,<2",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "tenacity>=9,<10",
  "python-multipart>=0.0.9,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
